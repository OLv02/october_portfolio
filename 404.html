<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101d19">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="icon" href="/october_portfolio/assets/icons/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px; color: #f1ead8; text-align: center;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: #101d19;
    background-image:
      radial-gradient(1.5px 1.5px at 24px 38px, rgba(241, 234, 216, 0.55), transparent),
      radial-gradient(1px 1px at 150px 96px, rgba(214, 220, 196, 0.45), transparent),
      radial-gradient(1.2px 1.2px at 92px 170px, rgba(224, 210, 165, 0.45), transparent),
      radial-gradient(ellipse 80% 55% at 80% 8%, rgba(88, 99, 75, 0.85), transparent 70%),
      radial-gradient(ellipse 70% 50% at 6% 92%, rgba(39, 63, 49, 0.9), transparent 70%);
    background-size: 230px 230px, 310px 310px, 270px 270px, 100% 100%, 100% 100%;
  }
  .code { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.3em; color: #b9c9a5; margin-bottom: 18px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(36px, 9vw, 66px); line-height: 1.05; letter-spacing: -0.04em; margin-bottom: 16px; }
  p { color: #c8cebc; font-size: 17px; line-height: 1.6; max-width: 26em; margin: 0 auto 30px; }
  a { display: inline-flex; align-items: center; min-height: 50px; padding: 0 26px; border-radius: 999px; color: #f1ead8; text-decoration: none;
      border: 1px solid rgba(185, 201, 165, 0.55); background: linear-gradient(135deg, rgba(185, 201, 165, 0.18), rgba(224, 210, 165, 0.12)); }
  a:hover, a:focus-visible { background: rgba(185, 201, 165, 0.22); outline: 2px solid #e0d2a5; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="code" id="t-code">ERROR 404</p>
    <h1 id="t-h">This page blew away on the wind.</h1>
    <p id="t-p">Whatever was here isn't anymore, or never was. The rest of the site is still rooted where you left it.</p>
    <a href="/october_portfolio/" id="t-a">Take me home</a>
  </main>
  <script>
    // The language the visitor picked on the main page, or else their device's language.
    (function () {
      var T = {
        fr: ['html:fr', 'Page introuvable', 'ERREUR 404', 'Cette page s’est envolée au vent.', 'Ce qui se trouvait ici n’y est plus, ou n’y a jamais été. Le reste du site est toujours enraciné là où vous l’avez laissé.', 'Retour à l’accueil'],
        de: ['html:de', 'Seite nicht gefunden', 'FEHLER 404', 'Diese Seite hat der Wind davongetragen.', 'Was hier war, ist nicht mehr da – oder war es nie. Der Rest der Website wurzelt noch genau dort, wo Sie ihn verlassen haben.', 'Zur Startseite']
      };
      var lang = null;
      try { lang = localStorage.getItem('site.lang'); } catch (e) { /* storage blocked */ }
      var device = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      for (var i = 0; i < device.length && !lang; i++) {
        var p = String(device[i] || '').toLowerCase().split(/[^a-z]/)[0];
        if (p === 'en' || T[p]) lang = p;
      }
      var t = T[lang];
      if (!t) return;
      document.documentElement.lang = t[0].slice(5);
      document.title = t[1];
      ['t-code', 't-h', 't-p', 't-a'].forEach(function (id, i) { document.getElementById(id).textContent = t[i + 2]; });
    })();
  </script>
</body>
</html>
